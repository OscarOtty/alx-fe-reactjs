<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Quiz App</title>
</head>
<body>

    <main class="w-full max-w-2xl p-4 md:p-8">
        <div id="app-container" class="bg-white rounded-xl shadow-2xl p-6 md:p-10 border-t-4 border-indigo-600 w-full">

            <!-- Title -->
            <h1 class="text-3xl font-extrabold text-gray-900 mb-6 text-center">
                <i data-lucide="brain-circuit" class="inline-block h-8 w-8 text-indigo-600 mr-2"></i>
                The Ultimate Quiz Challenge
            </h1>

            <!-- Loading Spinner -->
            <div id="loading" class="hidden flex flex-col items-center justify-center p-12">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600 mb-4"></div>
                <p class="text-indigo-600 font-semibold">Loading questions...</p>
            </div>

            <!-- Error Message -->
            <div id="error-message" class="hidden p-4 mb-4 text-sm text-red-700 bg-red-100 rounded-lg" role="alert">
                <span class="font-medium">Error!</span> <span id="error-text"></span>
            </div>

            <!-- 1. Configuration Screen -->
            <div id="config-screen">
                <p class="text-gray-600 mb-6 text-center">Select your quiz settings to begin.</p>
                
                <div class="space-y-4">
                    <!-- Number of Questions -->
                    <div>
                        <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">Number of Questions</label>
                        <input type="number" id="amount" min="1" max="50" value="10" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                    </div>

                    <!-- Category Selection -->
                    <div>
                        <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Select Category</label>
                        <select id="category" class="w-full p-3 border border-gray-300 rounded-lg bg-white focus:ring-indigo-500 focus:border-indigo-500">
                            <!-- Categories will be populated by JS -->
                            <option value="any">Any Category</option>
                        </select>
                    </div>
                    
                    <!-- Difficulty Selection -->
                    <div>
                        <label for="difficulty" class="block text-sm font-medium text-gray-700 mb-1">Difficulty</label>
                        <select id="difficulty" class="w-full p-3 border border-gray-300 rounded-lg bg-white focus:ring-indigo-500 focus:border-indigo-500">
                            <option value="any">Any Difficulty</option>
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>
                </div>

                <!-- Start Button -->
                <button onclick="startQuiz()" class="w-full mt-8 flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-md transition duration-150">
                    <i data-lucide="play" class="h-5 w-5 mr-2"></i>
                    Start Quiz
                </button>
            </div>

            <!-- 2. Quiz Screen -->
            <div id="quiz-screen" class="hidden">
                <!-- Progress Bar -->
                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
                </div>
                
                <!-- Question Counter -->
                <p class="text-sm text-gray-500 mb-4 text-center">Question <span id="current-q-num">1</span> of <span id="total-q-num">10</span></p>

                <!-- Question Text -->
                <h2 id="question-text" class="text-xl font-semibold text-gray-800 mb-6 leading-relaxed">
                    <!-- Question will be inserted here -->
                </h2>

                <!-- Answer Options -->
                <div id="options-container" class="space-y-3">
                    <!-- Options will be inserted as buttons by JS -->
                </div>
            </div>

            <!-- 3. Results Screen -->
            <div id="results-screen" class="hidden text-center p-8">
                <h2 class="text-3xl font-bold text-gray-900 mb-4">Quiz Complete!</h2>
                <div class="text-6xl mb-6" id="result-icon"></div>
                <p class="text-xl text-gray-700 mb-6">
                    You scored <span id="final-score" class="font-extrabold text-indigo-600 text-3xl">0</span> out of <span id="max-score" class="font-semibold text-2xl">0</span> questions.
                </p>
                <button onclick="restartQuiz()" class="w-full md:w-auto flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-lg text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 shadow-md transition duration-150">
                    <i data-lucide="rotate-ccw" class="h-5 w-5 mr-2"></i>
                    Start New Quiz
                </button>
            </div>
        </div>
    </main>

</body>
</html>
